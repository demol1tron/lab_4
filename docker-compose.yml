services:
  db:
    image: postgres:16-alpine
    container_name: railway_db
    restart: always
    environment:
      POSTGRES_DB: railway_safety
      POSTGRES_USER: railway_admin
      POSTGRES_PASSWORD: SecretUniversityPass2026
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - railway_net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U railway_admin -d railway_safety"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
    container_name: railway_backend
    restart: always
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://railway_admin:SecretUniversityPass2026@db:5432/railway_safety
      SECRET_KEY: server_jwt_secret_key_production_2026
      ALGORITHM: HS256
      ACCESS_TOKEN_EXPIRE_MINUTES: 120
    networks:
      - railway_net

  frontend:
    build:
      context: ./frontend
    container_name: railway_frontend
    restart: always
    ports:
      - "80:80"
    depends_on:
      - backend
    networks:
      - railway_net

volumes:
  pgdata:

networks:
  railway_net:
    driver: bridge
